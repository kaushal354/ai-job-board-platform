name: CI/CD Pipeline - Build & Deploy to Vercel

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    name: ⚡ Validate & Build Checks
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔍 Verify HTML & Asset Integrity
        run: |
          echo "Checking index.html, style.css, and app.js presence..."
          test -f index.html || exit 1
          test -f style.css || exit 1
          test -f app.js || exit 1
          echo "✅ All core web artifacts verified successfully!"

      - name: 🧪 Run Package Build Script
        run: |
          npm run build
          npm run test

  deploy-vercel:
    name: 🚀 Deploy to Vercel Cloud
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🌐 Deploy to Vercel Action
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          alias-domains: |
            nextdev-ai-job-board.vercel.app
